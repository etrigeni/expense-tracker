# Render's auto-deploy can't see this repo (it's linked to another GitHub account),
# so this triggers the backend deploy through the Render API instead.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

env:
  RENDER_SERVICE_ID: srv-d5clfv9r0fns739ss4f0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::The RENDER_API_KEY repository secret is missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > /dev/null
          echo "Deploy triggered on Render"
